<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="noches">
  <!-- noches mark, plate-less: the glyph itself is the icon, background stays transparent.
       Cobalt only - the brand's peach is a colour that sits ON the cobalt body, and as
       ink on a light tab strip it measures 1.4:1. It lives on the app icon instead. -->
  <style>
    .e{fill:#1B3A8F} .m{stroke:#1B3A8F}
    @media (prefers-color-scheme: dark){ .e{fill:#3A62D8} .m{stroke:#3A62D8} }
  </style>
  <circle class="e" cx="7.9" cy="9.6" r="5.7"/><circle class="e" cx="24.1" cy="9.6" r="5.7"/>
  <path class="m" d="M3.4 21.4 Q16 30.8 28.6 17.2" fill="none" stroke-width="5.7" stroke-linecap="round"/>
</svg>
